<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventra - Selamat Datang</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(-45deg, #020024, #090979, #00d4ff, #0f0c29);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: white;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background-color: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }

    .hero h1 {
      font-size: 4rem;
      font-weight: 700;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }

    .hero img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: 20px 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      opacity: 0;
      transform: scale(0.5);
      animation: fadeZoomIn 1s ease-out forwards;
    }

    @keyframes fadeZoomIn {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .hero p {
      font-size: 1.3rem;
      color: #dcdcdc;
    }

    .btn-glass {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 2px solid #ffffff55;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease-in-out;
    }

    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.3);
      color: #000;
      transform: translateY(-3px);
    }

    footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: #bbb;
      background-color: rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="container">
      <h1>INVENTRA</h1>
      <img src="{{ url_for('static', filename='img/logoinventra.png') }}" alt="Logo Inventra">
      <p>Solusi Cerdas untuk Manajemen Barang Anda</p>
      <a href="{{ url_for('login') }}" class="btn btn-glass">Masuk ke Sistem</a>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Inventra. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
